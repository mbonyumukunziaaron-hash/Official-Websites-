<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KaziConnect — Connect Skills With Opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   Plain CSS custom properties instead of a Tailwind config.
   Change a value here and it updates everywhere it's used.
============================================================ */
:root{
  --ink:#1B2A20;
  --paper:#F4F6F1;
  --paper-alt:#EAEEE1;
  --forest:#1F5E3D;
  --forest-dark:#153F29;
  --amber:#D98E2B;
  --amber-dark:#B8741E;
  --line:#DBE1D3;
  --slate:#5B6B5E;
  --white:#FFFFFF;
  --clay:#B5542A;
  --radius:16px;
  --max-width:1180px;
}

/* ============================================================
   RESET & BASE
============================================================ */
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ margin:0; }
p{ margin:0; }
ul,ol{ margin:0; padding:0; list-style:none; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,select{ font-family:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }
::selection{ background:var(--amber); color:var(--ink); }
:focus-visible{ outline:2px solid var(--forest); outline-offset:2px; }

.font-display{ font-family:'Fraunces', serif; }
.container{ max-width:var(--max-width); margin:0 auto; padding:0 20px; }

/* ============================================================
   LAYOUT HELPERS  (small reusable utility classes)
============================================================ */
.flex{ display:flex; }
.flex-col{ flex-direction:column; }
.items-center{ align-items:center; }
.items-start{ align-items:flex-start; }
.items-end{ align-items:flex-end; }
.justify-between{ justify-content:space-between; }
.justify-center{ justify-content:center; }
.gap-1{ gap:6px; } .gap-2{ gap:10px; } .gap-3{ gap:14px; } .gap-4{ gap:18px; } .gap-5{ gap:24px; }
.wrap{ flex-wrap:wrap; }
.grid{ display:grid; }
.hidden{ display:none !important; }
.w-full{ width:100%; }
.text-center{ text-align:center; }
.muted{ color:var(--slate); }
.small{ font-size:13px; }

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:999px; font-weight:500; padding:10px 20px; font-size:14px;
  transition:filter .15s ease, background-color .15s ease;
  white-space:nowrap;
}
.btn-lg{ padding:14px 26px; font-size:15px; }
.btn-sm{ padding:8px 16px; font-size:13px; }
.btn-primary{ background:var(--forest); color:#fff; }
.btn-primary:hover{ filter:brightness(0.94); }
.btn-amber{ background:var(--amber); color:#fff; }
.btn-amber:hover{ filter:brightness(0.94); }
.btn-secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); }
.btn-secondary:hover{ background:var(--paper-alt); }
.btn-ghost:hover{ background:var(--paper-alt); }
.btn-outline-light{ border:1px solid rgba(255,255,255,.4); color:#fff; }
.btn-outline-light:hover{ background:rgba(255,255,255,.1); }
.icon-btn{
  width:30px; height:30px; border-radius:999px; border:1px solid var(--line);
  display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{ background:var(--paper-alt); }

/* ============================================================
   CARDS, BADGES, AVATARS
============================================================ */
.card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); }
.card-hover:hover{ box-shadow:0 8px 24px -12px rgba(27,42,32,.18); }
.badge{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px;
  border-radius:999px; font-size:12px; font-weight:500;
}
.badge-dot{ width:6px; height:6px; border-radius:999px; }
.avatar{
  border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
  font-weight:600; flex-shrink:0;
}
.pill{
  font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line);
  display:inline-block;
}

/* ============================================================
   PROTOTYPE SWITCHER BAR
============================================================ */
.proto-bar{
  position:sticky; top:0; z-index:50; background:var(--ink); color:rgba(255,255,255,.8);
  font-size:13px; overflow-x:auto;
}
.proto-bar .container{ display:flex; align-items:center; gap:4px; padding:8px 20px; }
.proto-bar .label{ color:rgba(255,255,255,.4); padding-right:8px; flex-shrink:0; }
.proto-btn{ padding:6px 12px; border-radius:999px; flex-shrink:0; transition:background-color .15s; }
.proto-btn:hover{ background:rgba(255,255,255,.1); }
.proto-btn.active{ background:#fff; color:var(--ink); font-weight:500; }

/* ============================================================
   MARKETING NAVBAR + FOOTER
============================================================ */
.logo{ display:flex; align-items:center; gap:8px; }
.logo-mark{ width:32px; height:32px; border-radius:8px; background:var(--forest); display:flex; align-items:center; justify-content:center; }
.logo-mark span{ color:#fff; font-weight:600; font-size:15px; }
.logo-text{ font-weight:600; font-size:19px; letter-spacing:-0.02em; }

.navbar{
  border-bottom:1px solid var(--line); background:rgba(255,255,255,.9); backdrop-filter:blur(6px);
  position:sticky; top:41px; z-index:40;
}
.navbar .container{ height:64px; display:flex; align-items:center; justify-content:space-between; }
.nav-links{ display:none; align-items:center; gap:32px; font-size:14px; font-weight:500; color:rgba(27,42,32,.8); }
.nav-links a:hover{ color:var(--ink); }
.nav-actions{ display:none; align-items:center; gap:12px; }
.nav-login{ font-size:14px; font-weight:500; padding:0 8px; }
.nav-login:hover{ color:var(--forest); }
.mobile-toggle{ display:inline-flex; }
.mobile-menu{ border-top:1px solid var(--line); padding:16px 20px; display:flex; flex-direction:column; gap:16px; }
.mobile-menu .row{ display:flex; gap:12px; padding-top:8px; }
.mobile-menu .row .btn{ flex:1; }

@media (min-width:768px){
  .nav-links{ display:flex; }
  .nav-actions{ display:flex; }
  .mobile-toggle{ display:none; }
}

.footer{ background:var(--ink); color:#fff; }
.footer-top{ padding:56px 20px; display:grid; gap:40px; grid-template-columns:1fr; }
.footer-brand p{ color:rgba(255,255,255,.5); font-size:14px; line-height:1.6; max-width:220px; margin-top:12px; }
.footer-col h4{ font-size:13px; font-weight:500; color:rgba(255,255,255,.4); margin-bottom:12px; }
.footer-col ul{ display:flex; flex-direction:column; gap:10px; font-size:14px; color:rgba(255,255,255,.7); }
.footer-col a:hover{ color:#fff; }
.footer-bottom{ border-top:1px solid rgba(255,255,255,.1); }
.footer-bottom .container{ padding:20px; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:space-between; font-size:13px; color:rgba(255,255,255,.4); }
.footer-bottom .social{ display:flex; gap:16px; }
.footer-bottom .social a:hover{ color:#fff; }
@media (min-width:768px){
  .footer-top{ grid-template-columns:repeat(4,1fr); }
  .footer-bottom .container{ flex-direction:row; }
}

/* ============================================================
   HERO
============================================================ */
.hero{ padding:64px 20px 80px; display:grid; gap:56px; align-items:center; grid-template-columns:1fr; }
.hero-eyebrow{ font-size:13px; font-weight:500; color:var(--forest); margin-bottom:20px; }
.hero h1{ font-weight:600; font-size:42px; line-height:1.05; letter-spacing:-0.02em; }
.hero p.sub{ color:var(--slate); font-size:17px; line-height:1.6; margin-top:24px; max-width:480px; }
.hero-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
.hero-visual{ position:relative; height:420px; display:none; }
.hero-dotgrid{
  position:absolute; inset:0; opacity:.6;
  background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);
  background-size:22px 22px;
}
.hero-card{ position:absolute; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.hero-card.c1{ top:16px; left:8px; width:250px; transform:rotate(-3deg); }
.hero-card.c2{ top:96px; right:0; width:230px; transform:rotate(2deg); }
.hero-card.c3{ bottom:24px; left:40px; width:220px; border-color:var(--forest); box-shadow:0 4px 12px rgba(0,0,0,.08); }
.match-circle{
  width:44px; height:44px; border-radius:999px; background:var(--forest); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;
}
@media (min-width:768px){
  .hero{ grid-template-columns:1fr 1fr; padding:96px 20px 112px; }
  .hero h1{ font-size:56px; }
  .hero-visual{ display:block; }
}

/* ============================================================
   STATS / SECTIONS
============================================================ */
.section{ padding:96px 20px; }
.section-tinted{ background:var(--paper-alt); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.section h2.title{ font-weight:600; font-size:32px; max-width:520px; }
.stats-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:32px; padding:48px 0; }
.stat-value{ font-weight:600; font-size:34px; color:var(--forest); }
.stat-label{ color:var(--slate); font-size:14px; margin-top:4px; }
@media (min-width:768px){
  .stats-grid{ grid-template-columns:repeat(4,1fr); }
  .section h2.title{ font-size:38px; }
  .stat-value{ font-size:40px; }
}

.steps-grid{ display:grid; gap:40px; margin-top:48px; grid-template-columns:1fr; }
.steps-col h3{ font-weight:500; font-size:15px; color:var(--forest); margin-bottom:20px; }
.steps-col ol{ display:flex; flex-direction:column; gap:20px; }
.steps-col li{ display:flex; gap:16px; align-items:flex-start; }
.step-num{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--amber); width:32px; flex-shrink:0; }
@media (min-width:768px){ .steps-grid{ grid-template-columns:1fr 1fr; } }

.jobs-grid{ display:grid; gap:20px; grid-template-columns:1fr; margin-top:0; }
@media (min-width:640px){ .jobs-grid{ grid-template-columns:1fr 1fr; } }
@media (min-width:1024px){ .jobs-grid{ grid-template-columns:1fr 1fr 1fr; } }

.job-card{ padding:20px; display:flex; flex-direction:column; gap:16px; }
.job-card .type-pill{ font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:var(--paper-alt); color:var(--slate); flex-shrink:0; }
.job-card .meta{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--slate); }
.job-card .skills{ display:flex; flex-wrap:wrap; gap:6px; }
.job-card .price-row{ display:flex; align-items:center; justify-content:space-between; padding-top:12px; margin-top:auto; border-top:1px solid var(--line); }
.job-card .price{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--forest); }

.features-grid{ display:grid; gap:32px 40px; grid-template-columns:1fr; margin-top:48px; }
.feature h3{ font-weight:500; font-size:16px; margin-bottom:8px; }
.feature p{ color:var(--slate); font-size:14px; line-height:1.6; }
@media (min-width:640px){ .features-grid{ grid-template-columns:1fr 1fr; } }
@media (min-width:1024px){ .features-grid{ grid-template-columns:1fr 1fr 1fr; } }

.cta{ background:var(--forest-dark); color:#fff; text-align:center; }
.cta h2{ font-weight:600; font-size:32px; max-width:560px; margin:0 auto; line-height:1.25; }
.cta .hero-actions{ justify-content:center; margin-top:36px; }
@media (min-width:768px){ .cta h2{ font-size:42px; } }

/* ============================================================
   OPPORTUNITIES PAGE
============================================================ */
.filters-bar{ padding:16px; display:flex; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
.search-box{ display:flex; align-items:center; gap:8px; flex:1; min-width:200px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); }
.search-box input{ border:none; outline:none; flex:1; font-size:13px; background:transparent; }
.filters-bar select{ font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; }
.empty-state{ padding:56px 24px; text-align:center; }
.empty-state p:first-child{ font-weight:500; margin-bottom:6px; }

/* ============================================================
   OPPORTUNITY DETAIL
============================================================ */
.detail-wrap{ max-width:720px; margin:0 auto; padding:40px 20px; }
.back-link{ font-size:13px; color:var(--slate); display:inline-flex; align-items:center; gap:6px; margin-bottom:24px; }
.back-link:hover{ color:var(--ink); }
.detail-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.detail-header h1{ font-weight:600; font-size:28px; }
.detail-meta{ display:flex; flex-wrap:wrap; gap:8px 24px; font-size:14px; color:var(--slate); margin:16px 0 24px; }
.detail-meta .price{ color:var(--forest); font-weight:500; }
.detail-block{ padding:24px; margin-bottom:24px; }
.detail-block h2{ font-weight:500; font-size:15px; margin-bottom:12px; }
.detail-block p{ color:var(--slate); font-size:14px; line-height:1.6; }
.req-list li{ display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--slate); margin-bottom:10px; }
.req-list li:last-child{ margin-bottom:0; }
.applied-box{ padding:20px; display:flex; align-items:center; gap:12px; background:#E4EEE7; border-color:var(--forest); }
.applied-box p:first-child{ font-weight:500; font-size:14px; }
.applied-box p:last-child{ font-size:13px; color:var(--slate); }

/* ============================================================
   DASHBOARD SHELL (Worker / Business / Admin)
============================================================ */
.dash{ min-height:100vh; display:flex; }
.sidebar{ width:240px; flex-shrink:0; border-right:1px solid var(--line); background:#fff; display:none; flex-direction:column; }
.sidebar-head{ height:64px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid var(--line); }
.sidebar-nav{ flex:1; padding:20px 12px; display:flex; flex-direction:column; gap:4px; }
.sidebar-nav button{
  width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px;
  font-size:14px; font-weight:500; color:var(--slate); text-align:left;
}
.sidebar-nav button.active{ background:var(--paper-alt); color:var(--forest); }
.sidebar-foot{ padding:16px; border-top:1px solid var(--line); }
.sidebar-foot button{ font-size:13px; color:var(--slate); display:flex; align-items:center; gap:8px; }
.sidebar-foot button:hover{ color:var(--ink); }
@media (min-width:1024px){ .sidebar{ display:flex; } }

.dash-main{ flex:1; min-width:0; }
.dash-topbar{ height:64px; border-bottom:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.dash-topbar .role{ font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:var(--slate); }
.dash-content{ padding:24px; }
@media (min-width:768px){ .dash-content{ padding:32px; } }

.stat-card{ padding:20px; display:flex; align-items:center; gap:16px; }
.stat-card .icon-wrap{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-card .value{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; line-height:1; }
.stat-card .label{ font-size:13px; color:var(--slate); margin-top:4px; }
.stats-cards{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:32px; }
@media (min-width:640px){ .stats-cards{ grid-template-columns:1fr 1fr; } }
@media (min-width:1024px){ .stats-cards.cols-4{ grid-template-columns:repeat(4,1fr); } .stats-cards.cols-5{ grid-template-columns:repeat(5,1fr); } }

.progress-track{ height:8px; border-radius:999px; background:var(--paper-alt); }
.progress-fill{ height:8px; border-radius:999px; background:var(--forest); }

.two-col{ display:grid; grid-template-columns:1fr; gap:24px; }
@media (min-width:1024px){ .two-col{ grid-template-columns:2fr 1fr; } }

.list-row{ padding:16px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); }
.list-row:last-child{ border-bottom:none; }

.rec-card{ padding:16px; margin-bottom:16px; }
.rec-card .match-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.rec-card .match-row .match-circle{ width:36px; height:36px; font-size:12px; }
.rec-skill{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--slate); margin-bottom:4px; }

.tabs{ display:flex; align-items:center; gap:4px; margin-bottom:16px; }
.tab-btn{ padding:8px 16px; border-radius:999px; font-size:13px; font-weight:500; color:var(--slate); }
.tab-btn.active{ background:var(--forest); color:#fff; }

.applicant-row{ padding:16px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line); }
.applicant-row:last-child{ border-bottom:none; }
.applicant-actions{ display:none; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
@media (min-width:640px){ .applicant-actions{ display:flex; } }

table.admin-table{ width:100%; font-size:13px; border-collapse:collapse; }
table.admin-table thead tr{ text-align:left; color:var(--slate); border-bottom:1px solid var(--line); }
table.admin-table th, table.admin-table td{ padding:12px 16px; }
table.admin-table tbody tr{ border-bottom:1px solid var(--line); }
table.admin-table tbody tr:last-child{ border-bottom:none; }
.table-scroll{ overflow-x:auto; }

.bar-chart{ display:flex; align-items:flex-end; gap:16px; height:190px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.bar-col .bar{ width:100%; border-radius:6px 6px 0 0; background:var(--forest); min-height:4px; }
.bar-col .bar-label{ font-size:12px; color:var(--slate); }

.skill-bar-row .row-label{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
.skill-bar-row .row-label span:last-child{ color:var(--slate); }
.skill-track{ height:6px; border-radius:999px; background:var(--paper-alt); }
.skill-fill{ height:6px; border-radius:999px; background:var(--amber); }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================================
   ICONS
   Plain functions that return an SVG string. No component library —
   just string templates, same idea as building an HTML fragment by hand.
============================================================================ */
function icon(paths, size){
  size = size || 18;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
}
const Icons = {
  search: (s) => icon(`<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>`, s),
  pin: (s) => icon(`<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>`, s),
  clock: (s) => icon(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>`, s),
  coin: (s) => icon(`<circle cx="12" cy="12" r="9"/><path d="M9.5 15.5c.5 1 1.5 1.5 2.5 1.5 1.7 0 3-1 3-2.3 0-3.2-5.5-1.6-5.5-4.7 0-1.3 1.3-2.3 3-2.3 1 0 2 .5 2.5 1.5M12 6.5v11"/>`, s),
  briefcase: (s) => icon(`<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>`, s),
  arrow: (s) => icon(`<path d="M5 12h14M13 6l6 6-6 6"/>`, s),
  arrowBack: (s) => icon(`<path d="M19 12H5M11 18l-6-6 6-6"/>`, s),
  users: (s) => icon(`<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 14.2c2.6.5 4.5 2.5 4.5 5.8"/>`, s),
  building: (s) => icon(`<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>`, s),
  check: (s) => icon(`<path d="M20 6 9 17l-5-5"/>`, s),
  x: (s) => icon(`<path d="M18 6 6 18M6 6l12 12"/>`, s),
  trend: (s) => icon(`<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>`, s),
  menu: (s) => icon(`<path d="M4 7h16M4 12h16M4 17h16"/>`, s),
  bell: (s) => icon(`<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>`, s),
  file: (s) => icon(`<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>`, s),
  grid: (s) => icon(`<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>`, s),
};

/* ============================================================================
   MOCK DATA — stands in for a real backend. In a real app these would
   come from fetch('/api/...') calls instead of being written by hand.

/* ============================================================================
   STATE
   One plain object holds everything about "what the app currently shows".
   Every time we change it, we call render() to redraw the page from it —
   the same core idea React uses, just done by hand.
============================================================================ */
const state = {
  view: "landing",
  selectedJobId: 1,
  navOpen: false,
  filters: { query:"", location:"All locations", skill:"All skills", jobType:"All types" },
  visibleCount: 4,
  applied: false,
  businessTab: "applicants",
};

function setView(view){
  state.view = view;
  state.navOpen = false;
  if (view === "opportunities"){
    state.filters = { query:"", location:"All locations", skill:"All skills", jobType:"All types" };
    state.visibleCount = 4;
  }
  if (view === "opportunityDetail") state.applied = false;
  window.scrollTo(0,0);
  render();
}
function openOpportunity(id){
  state.selectedJobId = Number(id);
  setView("opportunityDetail");
}

/* ============================================================================
   OPPORTUNITIES MARKETPLACE  (this page updates itself without a full
   re-render, so the search box never loses focus while you type — see
   updateOpportunityResults() at the bottom)
============================================================================ */
function getFilteredJobs(){
  const { query, location, skill, jobType } = state.filters;
  return OPPORTUNITIES.filter(o => {
    const matchesQuery = (o.title + o.company).toLowerCase().includes(query.toLowerCase());
    const matchesLoc = location === "All locations" || o.location.startsWith(location);
    const matchesSkill = skill === "All skills" || o.skill === skill;
    const matchesType = jobType === "All types" || o.type === jobType;
    return matchesQuery && matchesLoc && matchesSkill && matchesType;
  });
}
function selectOptionsHTML(options, selected){
  return options.map(o => `<option value="${o}" ${o === selected ? "selected" : ""}>${o}</option>`).join("");
}
function renderOpportunitiesPage(){
  const locations = ["All locations", ...new Set(OPPORTUNITIES.map(o => o.location.split(",")[0]))];
  const skills = ["All skills", ...new Set(OPPORTUNITIES.map(o => o.skill))];
  const types = ["All types", ...new Set(OPPORTUNITIES.map(o => o.type))];
  const filtered = getFilteredJobs();
  const visible = filtered.slice(0, state.visibleCount);

  return `
  ${renderNavbar()}
  <div class="container" style="padding:40px 20px">
    <h1 class="font-display" style="font-weight:600;font-size:30px;margin-bottom:4px">Find your next opportunity</h1>
    <p id="results-count" class="muted small" style="margin-bottom:32px">${filtered.length} opportunities matching your search</p>

    <div class="card filters-bar">
      <div class="search-box">
        ${Icons.search(16)}
        <input type="text" placeholder="Search by title or business" data-filter="query" value="${state.filters.query}">
      </div>
      <select data-filter="location">${selectOptionsHTML(locations, state.filters.location)}</select>
      <select data-filter="skill">${selectOptionsHTML(skills, state.filters.skill)}</select>
      <select data-filter="jobType">${selectOptionsHTML(types, state.filters.jobType)}</select>
    </div>

    <div id="job-results" class="jobs-grid">
      ${visible.length ? visible.map(jobCardHTML).join("") : emptyStateHTML()}
    </div>
    <div id="load-more-wrap" class="text-center" style="margin-top:32px;${state.visibleCount < filtered.length ? "" : "display:none"}">
      <button class="btn btn-secondary" data-action="load-more">Load more opportunities</button>
    </div>
  </div>
  ${renderFooter()}`;
}
function emptyStateHTML(){
  return `<div class="card empty-state" style="grid-column:1/-1">
    <p>No opportunities match those filters</p>
    <p class="muted small">Try widening your search, or check back soon — new opportunities are posted daily.</p>
  </div>`;
}
// Updates only the results area — the filters and search input stay untouched.
function updateOpportunityResults(){
  const filtered = getFilteredJobs();
  const visible = filtered.slice(0, state.visibleCount);
  const countEl = document.getElementById("results-count");
  const resultsEl = document.getElementById("job-results");
  const loadMoreWrap = document.getElementById("load-more-wrap");
  if (countEl) countEl.textContent = `${filtered.length} opportunities matching your search`;
  if (resultsEl) resultsEl.innerHTML = visible.length ? visible.map(jobCardHTML).join("") : emptyStateHTML();
  if (loadMoreWrap) loadMoreWrap.style.display = state.visibleCount < filtered.length ? "block" : "none";
}

/* ============================================================================
   MAIN RENDER — decides which view function to call, based on state.view.
   No router library: just a lookup by name, same idea as a switch statement.
============================================================================ */
const VIEW_RENDERERS = {
  landing: renderLandingPage,
  workerDashboard: renderWorkerDashboard,
  opportunities: renderOpportunitiesPage,
  opportunityDetail: renderOpportunityDetail,
  businessDashboard: renderBusinessDashboard,
  adminDashboard: renderAdminDashboard,
};
function render(){
  const root = document.getElementById("root");
  root.innerHTML = renderPrototypeBar() + VIEW_RENDERERS[state.view]();
}

/* ============================================================================
   EVENT DELEGATION
   Instead of attaching a listener to every button (which would break every
   time we redraw the page), we attach ONE listener to the root element and
   check e.target to see what was actually clicked. This is called "event
   delegation" and it's a very common vanilla-JS pattern.
============================================================================ */
const root = document.getElementById("root");

root.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "set-view") setView(el.dataset.view);
  else if (action === "open-job") openOpportunity(el.dataset.jobId);
  else if (action === "toggle-nav") { state.navOpen = !state.navOpen; render(); }
  else if (action === "apply-job") {
    state.applied = true;
    const area = document.getElementById("apply-area");
    if (area) area.innerHTML = applyAreaHTML(OPPORTUNITIES.find(o => o.id === state.selectedJobId));
  }
  else if (action === "set-tab") {
    state.businessTab = el.dataset.tab;
    render();
  }
  else if (action === "load-more") {
    state.visibleCount += 4;
    updateOpportunityResults();
  }
});

// Typing in the search box: update only the results, so focus is never lost.
root.addEventListener("input", function(e){
  if (e.target.matches('[data-filter="query"]')){
    state.filters.query = e.target.value;
    state.visibleCount = 4;
    updateOpportunityResults();
  }
});

// Changing a dropdown filter.
root.addEventListener("change", function(e){
  const field = e.target.dataset.filter;
  if (field && field !== "query"){
    state.filters[field] = e.target.value;
    state.visibleCount = 4;
    updateOpportunityResults();
  }
});

// First paint.
render();
</script>
